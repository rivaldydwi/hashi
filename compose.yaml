# Hashi — Docker Compose untuk OptiPlex
# Pemakaian: lihat README.md

name: hashi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hashi_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?isi DB_OWNER_PASSWORD di file .env}
      POSTGRES_DB: ${DB_NAME:-hashi} # instance demo (-p hashi-demo) memakai hashi_demo, lihat scripts/demo-up.sh
      # Dipakai docker/postgres/init untuk membuat role aplikasi `hashi_app`
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?isi DB_APP_PASSWORD di file .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hashi_owner -d ${DB_NAME:-hashi}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    networks: [internal]

  # Jalan sekali setiap `up`: menerapkan migration baru, lalu berhenti.
  migrate:
    build:
      context: .
      target: tools
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      MIGRATE_DATABASE_URL: postgresql://hashi_owner:${DB_OWNER_PASSWORD}@db:5432/${DB_NAME:-hashi}
      DATABASE_URL: postgresql://hashi_app:${DB_APP_PASSWORD}@db:5432/${DB_NAME:-hashi}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      STORAGE_DIR: /app/docs-data # seed menulis berkas dokumen dummy ke volume yang sama dengan app
    volumes:
      - docs-data:/app/docs-data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 384m
    networks: [internal]

  # Pengingat email 在留カード (T-022): berjalan terus, tiap hari 08:00 Asia/Tokyo. Memakai image `tools` (hanya src/db + scripts). TANPA SMTP_URL = MODE KERING (tidak ada email terkirim,
  # hanya log "akan dikirim"); produksi tetap kering sampai akun SMTP disiapkan (BUTUH IPAL). Role aplikasi biasa (hashi_app) lewat withSystem/withTenant, bukan OWNER.
  worker:
    build:
      context: .
      target: tools
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: ["node", "--import", "tsx", "scripts/reminder-worker.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hashi_app:${DB_APP_PASSWORD}@db:5432/${DB_NAME:-hashi}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    networks: [internal]

  app:
    build:
      context: .
      target: runner
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hashi_app:${DB_APP_PASSWORD}@db:5432/${DB_NAME:-hashi}
      AUTH_SECRET: ${AUTH_SECRET:?isi AUTH_SECRET di file .env}
      # Kunci enkripsi nomor/foto 在留カード (T-020): BARU dan terpisah dari AUTH_SECRET (buat: scripts/ensure-card-key.sh). Hilang = data kartu tidak bisa dipulihkan (docs/backup.md).
      # Sengaja BUKAN `:?` supaya perintah compose lain (db-dev, build migrate, demo-down) tidak ikut gagal; aplikasi sendiri menolak start tanpa kunci sah
      # (src/instrumentation.ts) dan scripts/deploy.sh memeriksanya sebelum menyentuh container.
      CARD_DATA_KEY: ${CARD_DATA_KEY:-}
      CARD_DATA_KEY_ID: ${CARD_DATA_KEY_ID:-k1}
      CARD_DATA_KEYS_OLD: ${CARD_DATA_KEYS_OLD:-}
      AUTH_TRUST_HOST: "true"
      SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      STORAGE_DIR: /app/docs-data
    volumes:
      - docs-data:/app/docs-data
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3100}:3100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 768m
    networks: [internal]

volumes:
  db-data:
  docs-data: # file dokumen kandidat (ikut di-backup, lihat README)

networks:
  internal:
