name: CI

# T-028: commit/PR yang HANYA mengubah dokumen tidak menjalankan CI (hemat menit). Filter dievaluasi per push (push) atau terhadap
# SELURUH diff PR (pull_request): PR yang menyentuh satu berkas kode tetap menjalankan CI penuh.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Push beruntun ke ref yang sama membatalkan putaran lama (hanya hasil terbaru yang berguna).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrate, seed, uji database, build, uji browser
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hashi_owner
          POSTGRES_PASSWORD: owner-ci
          POSTGRES_DB: hashi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hashi_owner -d hashi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Penerima email UJI untuk e2e pengingat 在留カード (T-022): SMTP 1025, API 8025; tidak mengirim ke luar
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      MIGRATE_DATABASE_URL: postgresql://hashi_owner:owner-ci@localhost:5432/hashi_test
      DATABASE_URL: postgresql://hashi_app:app-ci@localhost:5432/hashi_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Buat role aplikasi (sama seperti docker/postgres/init)
        run: psql "$MIGRATE_DATABASE_URL" -c "CREATE ROLE hashi_app LOGIN NOBYPASSRLS PASSWORD 'app-ci'"
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Periksa kelengkapan seed demo (filter bermakna, tanpa berkas yatim)
        run: npm run verify:seed
      - run: npm run test:rls
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:i18n
      - run: npm run test:unit
      - name: Cakupan audit (server action yang menulis harus tercatat)
        run: npm run verify:audit-coverage
      - name: Pasang browser untuk tes e2e
        run: npx playwright install --with-deps chromium
      - name: Tes e2e (browser)
        run: npm run test:e2e
      # Data PILOT (T-014): dijalankan SETELAH tes lain karena menambah 200 kandidat (tes lain bergantung isi seed dasar). Dua kali = tidak menggandakan.
      - name: Seed pilot (+200 kandidat, pekerja aktif, semua tahap kartu)
        run: npm run seed:pilot
      - name: Periksa data pilot (jumlah, kelengkapan, KPI = daftar)
        run: npm run verify:pilot
      - name: Seed pilot dijalankan LAGI = tidak menggandakan
        run: |
          npm run seed:pilot | tee /tmp/pilot2.log
          grep -q "sudah ada" /tmp/pilot2.log
          npm run verify:pilot
      - name: Simpan laporan tes kalau gagal
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Build image Docker dan jalankan test:rls dari image tools
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hashi_owner
          POSTGRES_PASSWORD: owner-ci
          POSTGRES_DB: hashi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hashi_owner -d hashi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATE_DATABASE_URL: postgresql://hashi_owner:owner-ci@localhost:5432/hashi_test
      DATABASE_URL: postgresql://hashi_app:app-ci@localhost:5432/hashi_test
    steps:
      - uses: actions/checkout@v5
      - name: Build image runner dan tools dengan GIT_SHA (T-005)
        run: |
          SHA="${GITHUB_SHA::7}"
          docker build --target runner --build-arg GIT_SHA="$SHA" -t hashi-app:ci .
          docker build --target tools --build-arg GIT_SHA="$SHA" -t hashi-tools:ci .
      # Label revision harus sama dengan commit yang dibangun; tanpa --build-arg build tetap berhasil dan hasilnya "unknown"
      - name: Label revision image = commit; tanpa GIT_SHA tetap "unknown"
        run: |
          SHA="${GITHUB_SHA::7}"
          test "$(docker image inspect hashi-app:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SHA"
          test "$(docker image inspect hashi-tools:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SHA"
          docker build --target runner -t hashi-app:noarg .
          test "$(docker image inspect hashi-app:noarg --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "unknown"
          docker run --rm hashi-app:ci sh -c 'test "$GIT_SHA" = "'"$SHA"'"'
          docker run --rm hashi-app:noarg sh -c 'test "$GIT_SHA" = "unknown"'
      # Sama seperti di OptiPlex (`docker compose run --rm migrate ...`): script berjalan DI DALAM image
      # tools yang hanya berisi src/db. Impor ke modul di luar itu gagal di sini, bukan di produksi.
      - name: Buat role aplikasi
        run: docker run --rm --network host postgres:16-alpine psql "$MIGRATE_DATABASE_URL" -c "CREATE ROLE hashi_app LOGIN NOBYPASSRLS PASSWORD 'app-ci'"
      - name: Migrate (dari image tools)
        run: docker run --rm --network host -e MIGRATE_DATABASE_URL -e DATABASE_URL hashi-tools:ci
      # Volume bernama dipasang ke /app/docs-data (seperti di compose): seed menulis berkas dummy, verify:seed memeriksanya
      - name: Seed (dari image tools)
        run: docker run --rm --network host -v ci-docs:/app/docs-data -e MIGRATE_DATABASE_URL -e DATABASE_URL hashi-tools:ci npm run db:seed
      - name: verify:seed (dari image tools)
        run: docker run --rm --network host -v ci-docs:/app/docs-data -e MIGRATE_DATABASE_URL -e DATABASE_URL hashi-tools:ci npm run verify:seed
      - name: Image produksi memuat font Jepang untuk PDF dan sharp berfungsi (rotasi EXIF, tanpa metadata)
        run: |
          docker run --rm hashi-app:ci sh -c 'test -s /app/assets/fonts/NotoSansJP-Regular.ttf && test -s /app/assets/fonts/NotoSansJP-Bold.ttf && node -e "
          const sharp = require(\"sharp\");
          sharp({ create: { width: 50, height: 30, channels: 3, background: \"#c2410c\" } }).withMetadata({ orientation: 6 }).jpeg().toBuffer()
            .then((b) => sharp(b).rotate().toBuffer()).then((o) => sharp(o).metadata())
            .then((m) => { if (m.width !== 30 || m.height !== 50 || m.exif) process.exit(1); console.log(\"sharp ok\"); })"'
      - name: test:rls (dari image tools)
        run: docker run --rm --network host -e MIGRATE_DATABASE_URL -e DATABASE_URL hashi-tools:ci npm run test:rls
